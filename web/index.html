<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Teach, try and improve your business AI. A local workbench that keeps you in control.">
  <title>Own — Your business AI</title>
  <link rel="icon" type="image/svg+xml" href="/mark.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a href="#main" class="skip">Skip to content</a>
  <div id="shell">
    <aside class="rail" aria-label="Workspace navigation">
      <a class="brand" href="#home" aria-label="Own home"><img src="/mark.svg" width="38" height="38" alt=""><span>own<span class="brand-dot">.</span></span></a>
      <div id="workspace-picker"></div>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="rail-bottom">
        <div class="local-note"><span class="status-dot"></span><span>On your laptop<small>Local edition · step 1</small></span></div>
        <button class="connection" data-action="connection"><span id="connection-label">Checking AI connection…</span><span aria-hidden="true">↗</span></button>
      </div>
    </aside>
    <div class="body">
      <header class="topbar"><span id="breadcrumb">Your workspace</span><div class="topbar-right"><span class="privacy-label">Your work stays here</span><button class="button small secondary" data-action="roadmap">The bigger picture <span aria-hidden="true">↗</span></button></div></header>
      <main id="main" tabindex="-1"><div class="initial-loading" role="status">Opening your workspace…</div></main>
      <footer>Built around your expertise. You decide what changes.</footer>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  <noscript>Own needs JavaScript enabled. Your business data is stored by the local app on this laptop.</noscript>
</body>
</html>
